<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Portal Login | QC+</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' } }
                }
            }
        }
    </script>
    <style>
        body { background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); min-height: 100vh; }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 antialiased selection:bg-brand-500 selection:text-white">
    
    <main class="glass-card p-10 rounded-3xl w-full max-w-sm text-center relative overflow-hidden">
        <div class="w-16 h-16 bg-gradient-to-br from-brand-500 to-indigo-600 rounded-2xl flex items-center justify-center text-white font-black text-2xl shadow-lg shadow-brand-500/30 mx-auto mb-6">QC+</div>
        
        <h1 class="text-2xl font-extrabold text-slate-900 mb-1">Doctor Portal</h1>
        <p class="text-slate-500 font-medium text-sm mb-8">Enter your clinic PIN to continue</p>

        <div class="space-y-6">
            <div>
                <input type="password" id="pinInput" placeholder="••••" class="w-full text-center text-3xl tracking-widest font-black p-4 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand-500 focus:border-transparent outline-none transition-all" maxlength="4">
            </div>
            
            <button onclick="verifyPin()" class="w-full bg-slate-900 text-white p-4 rounded-xl font-bold text-lg hover:bg-brand-600 hover:shadow-lg hover:shadow-brand-500/30 transition-all active:scale-95 outline-none">
                Access Dashboard
            </button>
        </div>
        
        <p id="errorMsg" class="text-red-500 font-bold text-sm mt-4 opacity-0 transition-opacity">Invalid PIN.</p>
    </main>

    <script>
        // Multi-Clinic Directory
        const CLINIC_DIRECTORY = {
            "1234": { 
                id: "citycare", 
                name: "City Care Clinic", 
                api: "https://script.google.com/macros/s/AKfycbzN4GuiY6ue5D0UTj8nJ5XSKtjbv8Y8CFdYyC1e-citPAcjYlHwgYE9-yVYUttfET-4CQ/exec" 
            },
            "5678": { 
                id: "smileplus", 
                name: "Smile Plus Dental", 
                api: "https://script.google.com/macros/s/AKfycbycaFux2UoOzUgkrwljM2l9z6O-caXQMv3D4vDtrBhzsRJ5JUxF3i0-7SKYHvwS_D7zhQ/exec" 
            }
        };

        function verifyPin() {
            const pin = document.getElementById('pinInput').value;
            const errorEl = document.getElementById('errorMsg');
            
            if (CLINIC_DIRECTORY[pin]) {
                const clinic = CLINIC_DIRECTORY[pin];
                
                // Save secure session data
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('active_api', clinic.api);
                localStorage.setItem('clinic_id', clinic.id);
                localStorage.setItem('active_clinic_name', clinic.name);
                
                // Redirect to dashboard
                window.location.href = 'dashboard.html';
            } else {
                errorEl.classList.remove('opacity-0');
                setTimeout(() => errorEl.classList.add('opacity-0'), 3000);
                document.getElementById('pinInput').value = '';
            }
        }

        // Allow Enter key to submit
        document.getElementById('pinInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verifyPin();
        });
    </script>
</body>
</html>
