<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Dashboard | Premium Management</title>
    
    <!-- Premium Font & Tailwind Runtime Engine -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' } }
                }
            }
        }
    </script>

    <style>
        body { background-color: #f8fafc; }
        .glass-header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }
        .toast { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s; }
        .hidden { display: none !important; }
        .card-hover { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen selection:bg-brand-500 selection:text-white">
    
    <!-- Global Toast Container -->
    <div id="toast-container" aria-live="assertive" class="fixed top-6 right-6 z-50 flex flex-col gap-3"></div>

   <!-- THE SECURE LOGIN SCREEN -->

    <!-- THE MAIN DASHBOARD -->
    <main id="mainDashboard" aria-hidden="false">
        
        <!-- Premium Glass Header -->
        <header class="glass-header sticky top-0 z-40 px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-gradient-to-br from-brand-500 to-indigo-600 rounded-lg flex items-center justify-center text-white font-black shadow-lg shadow-brand-500/30">QC+</div>
                <div>
                    <h1 class="text-xl font-extrabold text-slate-900 leading-tight">City Care Clinic</h1>
                    <p class="text-xs font-semibold text-brand-600 tracking-wide uppercase">Live Queue Manager</p>
                </div>
            </div>
            
<nav class="flex flex-wrap gap-2" aria-label="Dashboard Actions">
    <!-- NEW SMART TV BUTTON -->
    <a href="tv.html" target="_blank" class="flex items-center gap-2 px-5 py-2.5 bg-indigo-50 text-indigo-600 rounded-xl font-extrabold hover:bg-indigo-100 transition-all border border-indigo-100 shadow-sm hover:shadow active:scale-95">
        <span class="text-xl">📺</span> Launch TV
    </a>
    
    <button onclick="Dashboard.loadQueue()" class="flex items-center gap-2 px-4 py-2.5 bg-white border border-slate-200 text-slate-700 rounded-xl font-bold hover:bg-slate-50 transition-all shadow-sm active:scale-95">
        <span class="text-lg">↻</span> Refresh
    </button>
    <button onclick="Dashboard.showQR()" class="flex items-center gap-2 px-4 py-2.5 bg-white border border-slate-200 text-slate-700 rounded-xl font-bold hover:bg-slate-50 transition-all shadow-sm active:scale-95">
        <span class="text-lg">📱</span> QR Code
    </button>
    <button onclick="Dashboard.exportCSV()" class="flex items-center gap-2 px-4 py-2.5 bg-white border border-slate-200 text-slate-700 rounded-xl font-bold hover:bg-slate-50 transition-all shadow-sm active:scale-95">
        <span class="text-lg">📥</span> Export
    </button>
    <button onclick="Dashboard.triggerReset()" class="flex items-center gap-2 px-4 py-2.5 bg-red-50 border border-red-100 text-red-600 rounded-xl font-bold hover:bg-red-100 transition-all shadow-sm active:scale-95">
        <span class="text-lg">⚠</span> Reset
    </button>
    <button onclick="Auth.logOut()" class="px-4 py-2.5 text-slate-500 font-bold hover:text-slate-800 transition-colors">
        Log Out
    </button>
</nav>
        </header>

        <div class="max-w-7xl mx-auto p-6 mt-4">
            <!-- WAI-ARIA Tab Navigation -->
            <div role="tablist" class="mb-8 flex gap-2 border-b border-slate-200 pb-px">
                <button role="tab" id="tab-live" onclick="Dashboard.switchTab('live')" class="text-lg font-bold text-brand-600 border-b-2 border-brand-600 pb-3 px-6 transition-colors">Live Queue</button>
                <button role="tab" id="tab-history" onclick="Dashboard.switchTab('history')" class="text-lg font-semibold text-slate-400 hover:text-slate-700 border-b-2 border-transparent pb-3 px-6 transition-colors">History Log</button>
            </div>

            <!-- VIEW 1: LIVE QUEUE -->
            <div id="view-live" role="tabpanel" class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- Pending Section -->
                <section>
                    <header class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-extrabold text-slate-900">New Requests</h2>
                        <span class="text-xs font-bold bg-amber-100 text-amber-700 px-3 py-1 rounded-full uppercase tracking-wider">Pending</span>
                    </header>
                    <div id="pendingList" class="space-y-4">Loading...</div>
                </section>

                <!-- Active Section -->
                <section>
                    <header class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-extrabold text-slate-900">Active Queue</h2>
                        <span class="text-xs font-bold bg-brand-100 text-brand-700 px-3 py-1 rounded-full uppercase tracking-wider">Waiting</span>
                    </header>
                    <div id="activeList" class="space-y-4">Loading...</div>
                </section>
            </div>

            <!-- VIEW 2: HISTORY LOG -->
            <div id="view-history" role="tabpanel" class="hidden">
                <h2 class="text-xl font-extrabold text-slate-900 mb-6">Today's Activity</h2>
                <div id="historyList" class="space-y-3">Loading history...</div>
            </div>
        </div>
    </main>

    <!-- PREMIUM MODALS -->
    <dialog id="qrModal" class="bg-transparent p-0 m-auto backdrop:bg-slate-900/60 w-full max-w-sm border-0">
        <div class="bg-white p-8 rounded-3xl shadow-2xl text-center transform transition-all scale-100">
            <h2 class="text-2xl font-extrabold text-slate-900 mb-1">Join Queue</h2>
            <p class="text-sm text-slate-500 font-medium mb-8">Scan to get your digital token.</p>
            
            <div id="qrcode-container" class="flex justify-center mb-8 p-4 bg-white border-2 border-slate-100 shadow-inner rounded-2xl inline-block mx-auto"></div>
            
            <button onclick="document.getElementById('qrModal').close()" class="w-full py-3.5 bg-slate-100 text-slate-700 font-bold rounded-xl hover:bg-slate-200 transition-colors">Close</button>
        </div>
    </dialog>

    <dialog id="resetModal" class="bg-transparent p-0 m-auto backdrop:bg-slate-900/60 w-full max-w-md border-0">
        <div class="bg-white p-8 rounded-3xl shadow-2xl text-center">
            <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4 text-red-500 text-2xl">⚠</div>
            <h3 class="text-2xl font-extrabold text-slate-900 mb-2">Reset Daily Queue?</h3>
            <p class="text-slate-500 font-medium mb-8">This permanently deletes today's patient data and resets tokens to #1.</p>
            <div class="flex justify-center gap-3">
                <button onclick="document.getElementById('resetModal').close()" class="px-6 py-3.5 text-slate-600 font-bold bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors">Cancel</button>
                <button onclick="Dashboard.executeReset()" class="px-6 py-3.5 bg-red-500 text-white font-bold rounded-xl hover:bg-red-600 shadow-lg shadow-red-500/30 transition-all">Yes, Reset Data</button>
            </div>
        </div>
    </dialog>

    <script>
        // 1. DYNAMIC API ROUTING (Pulled from login.html memory)
        const API_URL = localStorage.getItem('active_api');
        const CLINIC_ID = localStorage.getItem('clinic_id');
        const CLINIC_NAME = localStorage.getItem('active_clinic_name');

        const UI = {
            showToast: (msg, type = 'success') => {
                const c = document.getElementById('toast-container');
                const t = document.createElement('div');
                const colors = type === 'error' ? 'bg-red-500 text-white' : 'bg-slate-800 text-white';
                t.className = `toast translate-x-full opacity-0 ${colors} px-6 py-3.5 rounded-xl shadow-2xl text-sm font-bold border border-white/10`;
                t.innerText = msg; c.appendChild(t);
                requestAnimationFrame(() => t.classList.remove('translate-x-full', 'opacity-0'));
                setTimeout(() => { t.classList.add('translate-x-full', 'opacity-0'); setTimeout(() => t.remove(), 400); }, 4000);
            }
        };

        // 2. NEW AUTHENTICATION CHECK
        const Auth = {
            checkSession() {
                if (localStorage.getItem('isLoggedIn') !== 'true' || !API_URL) {
                    window.location.href = 'login.html';
                } else {
                    // Update the UI with the correct clinic name
                    const headerTitle = document.querySelector('header h1');
                    if (headerTitle) headerTitle.innerText = CLINIC_NAME;
                    Dashboard.init();
                }
            },
            logOut() {
                localStorage.clear();
                window.location.href = 'login.html';
            }
        };

        const Dashboard = {
            state: { data: [], intervalId: null, qrGenerated: false },
            init() { this.loadQueue(); this.intervalId = setInterval(() => this.loadQueue(), 15000); document.addEventListener("visibilitychange", this.handleVis); },
            destroy() { clearInterval(this.intervalId); document.removeEventListener("visibilitychange", this.handleVis); },
            handleVis() { if (!document.hidden) Dashboard.loadQueue(); },
            
            switchTab(t) {
                document.getElementById('view-live').classList.toggle('hidden', t !== 'live');
                document.getElementById('view-history').classList.toggle('hidden', t === 'live');
                document.getElementById('tab-live').className = t === 'live' ? "text-lg font-bold text-brand-600 border-b-2 border-brand-600 pb-3 px-6" : "text-lg font-semibold text-slate-400 hover:text-slate-700 border-b-2 border-transparent pb-3 px-6";
                document.getElementById('tab-history').className = t !== 'live' ? "text-lg font-bold text-brand-600 border-b-2 border-brand-600 pb-3 px-6" : "text-lg font-semibold text-slate-400 hover:text-slate-700 border-b-2 border-transparent pb-3 px-6";
            },
            
            async loadQueue() {
                if (document.hidden) return;
                try { const res = await fetch(API_URL); this.state.data = await res.json(); this.renderUI(); } 
                catch (e) { UI.showToast("Sync issue. Retrying...", "error"); }
            },
            
            renderUI() {
    const pend = this.state.data.filter(p => p.status === 'Pending');
    // Fetch both Active and Called patients for the middle column
    const act = this.state.data.filter(p => p.status === 'Active' || p.status === 'Called');
    const hist = this.state.data.filter(p => ['Completed', 'Cancelled'].includes(p.status)).reverse();

    document.getElementById('pendingList').innerHTML = pend.map(p => `
        <article class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 card-hover flex flex-col gap-4">
            <div class="flex justify-between items-center"><span class="font-extrabold text-lg text-slate-900">#${p.token} - ${p.name}</span><span class="text-xs font-semibold bg-slate-100 text-slate-500 px-2.5 py-1 rounded-md">${p.phone}</span></div>
            <div class="flex gap-3 items-center bg-slate-50 p-3 rounded-xl border border-slate-100">
                <label class="text-sm font-semibold text-slate-600">Assign Wait (m):</label>
                <input type="number" id="time-${p.token}" value="${p.waitTime}" class="border border-slate-200 p-1.5 w-16 text-center rounded-lg font-bold focus:ring-2 focus:ring-brand-500 outline-none">
                <button onclick="Dashboard.updateStatus(${p.token}, 'Active')" class="ml-auto bg-brand-500 text-white px-5 py-2 rounded-lg font-bold hover:bg-brand-600 shadow-md shadow-brand-500/20 transition-all active:scale-95">Accept</button>
            </div>
        </article>`).join('') || '<div class="text-center p-10 bg-white rounded-2xl border border-dashed border-slate-200"><p class="text-slate-400 font-semibold">No pending requests.</p></div>';

    document.getElementById('activeList').innerHTML = act.map(p => {
        const isCalled = p.status === 'Called';
        return `
        <article class="flex justify-between items-center bg-white p-5 rounded-2xl shadow-sm border ${isCalled ? 'border-green-400 shadow-green-500/20' : 'border-slate-100'} card-hover">
            <div class="flex gap-4 items-center">
                <div class="w-14 h-14 bg-gradient-to-br ${isCalled ? 'from-green-100 to-emerald-50 text-green-600 border-green-200' : 'from-brand-100 to-indigo-50 text-brand-600 border-brand-100/50'} rounded-xl flex items-center justify-center font-black text-xl border">#${p.token}</div>
                <div>
                    <h3 class="font-extrabold text-lg text-slate-900">${p.name}</h3>
                    <p class="text-sm font-medium ${isCalled ? 'text-green-600 animate-pulse' : 'text-slate-500'}">${isCalled ? 'Calling Patient...' : `Wait: ${p.waitTime} mins`}</p>
                </div>
            </div>
            <div class="flex gap-2">
                ${!isCalled ? `<button onclick="Dashboard.updateStatus(${p.token}, 'Called')" class="bg-amber-500 text-white px-4 py-2.5 rounded-xl font-bold hover:bg-amber-600 shadow-md shadow-amber-500/20 transition-all active:scale-95">🔔 Call</button>` : ''}
                <button onclick="Dashboard.updateStatus(${p.token}, 'Completed')" class="bg-emerald-500 text-white px-4 py-2.5 rounded-xl font-bold hover:bg-emerald-600 shadow-md shadow-emerald-500/20 transition-all active:scale-95">Mark Done</button>
            </div>
        </article>`
    }).join('') || '<div class="text-center p-10 bg-white rounded-2xl border border-dashed border-slate-200"><p class="text-slate-400 font-semibold">Queue is empty.</p></div>';

    document.getElementById('historyList').innerHTML = hist.map(p => {
        const isDone = p.status === 'Completed';
        return `
        <article class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-100 mb-3">
            <div><h3 class="font-bold text-slate-900">#${p.token} - ${p.name}</h3><p class="text-xs font-medium text-slate-400">${p.phone}</p></div>
            <span class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide ${isDone ? 'bg-emerald-50 text-emerald-600' : 'bg-red-50 text-red-500'}">${p.status}</span>
        </article>`}).join('') || '<p class="text-slate-400 font-medium text-center p-6">No history recorded yet today.</p>';
},
            
            async updateStatus(t, s) {
    const w = s === 'Active' ? document.getElementById(`time-${t}`).value : 0;
    
    // --- 1. OPTIMISTIC UI: INSTANT FRONTEND UPDATE ---
    // Find the patient in our local memory and change their status immediately
    const patientIndex = this.state.data.findIndex(p => p.token === t);
    if (patientIndex !== -1) {
        this.state.data[patientIndex].status = s;
        if (s === 'Active') this.state.data[patientIndex].waitTime = w;
        
        // Instantly redraw the screen (Zero latency)
        this.renderUI(); 
    }

    // --- 2. BACKGROUND SYNC: SILENT GOOGLE UPDATE ---
    try {
        // We do NOT use 'await' here. We let this run quietly in the background.
        fetch(API_URL, { 
            method: 'POST', 
            body: JSON.stringify({ action: 'update', token: t, status: s, waitTime: w }) 
        }).then(response => response.json())
          .then(data => {
              // If we wanted to, we could silently sync here, but the UI is already updated!
              console.log("Background sync complete for token #" + t);
          }).catch(e => {
              // Only bother the user if the background sync actually fails
              console.error("Sync error", e);
          });
    } catch(e) {
        console.error(e);
    }
},
            
            exportCSV() {
                if (!this.state.data.length) return UI.showToast("No data to export.", "error");
                let csv = "Token,Name,Phone,Status,Wait Time\n" + this.state.data.map(r => `${r.token},"${r.name}","${r.phone}",${r.status},${r.waitTime}`).join('\n');
                const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = `Queue_Export_${new Date().toISOString().split('T')[0]}.csv`; a.click();
            },
            
            triggerReset() { document.getElementById('resetModal').showModal(); },
            async executeReset() { 
                document.getElementById('resetModal').close(); 
                await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'reset' }) }); 
                this.loadQueue(); UI.showToast("Queue reset successfully."); 
            },
            
            showQR() {
    if (!this.state.qrGenerated) {
        const baseUrl = window.location.href.split('?')[0].replace('dashboard.html', '');
        const cleanBase = baseUrl.endsWith('/') ? baseUrl : baseUrl + '/';
        // NEW: Appends the clinic ID to the URL (e.g., ?c=citycare)
        const patientUrl = `${cleanBase}index.html?c=${CLINIC_ID}`;
        
        new QRCode(document.getElementById("qrcode-container"), { text: patientUrl, width: 220, height: 220, colorDark: "#0f172a", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
        this.state.qrGenerated = true;
    }
    document.getElementById('qrModal').showModal();
}
        
        window.onload = () => Auth.checkSession();
    </script>
</body>
</html>
