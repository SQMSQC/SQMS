<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueueCounter+ | Premium Patient Experience</title>
    
    <!-- Premium Font & Tailwind Runtime Engine -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' } }
                }
            }
        }
    </script>

    <style>
        body { background: linear-gradient(135deg, #e0e7ff 0%, #ede9fe 100%); min-height: 100vh; }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
        }
        .fade-text { transition: opacity 0.5s ease-in-out; }
        .toast { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s; }
        input:focus + label, input:not(:placeholder-shown) + label {
            transform: translateY(-1.5rem) scale(0.85);
            color: #2563eb;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 antialiased text-gray-900 selection:bg-brand-500 selection:text-white">
    
    <!-- Toast Notification -->
    <div id="toast-container" aria-live="polite" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-3"></div>

    <main class="glass-card p-8 sm:p-10 rounded-3xl w-full max-w-md relative overflow-hidden">
        <!-- Decorative Background Element -->
        <div class="absolute -top-20 -right-20 w-40 h-40 bg-brand-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse"></div>

        <header class="text-center mb-10 relative z-10">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-brand-600 to-indigo-600 tracking-tight mb-2">QueueCounter<span class="text-green-500">+</span></h1>
            <p class="text-gray-500 font-medium text-sm">Seamless. Transparent. Fast.</p>
        </header>

        <!-- Join Form -->
        <form id="joinForm" class="space-y-6 relative z-10">
            <div class="relative">
                <input type="text" id="name" placeholder=" " required class="block w-full rounded-xl border-gray-200 bg-white/50 border p-4 text-gray-900 focus:bg-white focus:ring-2 focus:ring-brand-500 focus:border-transparent outline-none transition-all peer placeholder-transparent">
                <label for="name" class="absolute text-gray-500 duration-300 transform -translate-y-1/2 scale-100 top-1/2 left-4 z-10 origin-[0] peer-focus:text-brand-600 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-[-50%] peer-focus:scale-85 peer-focus:-translate-y-[1.5rem] bg-transparent px-1 font-medium pointer-events-none">Full Name</label>
            </div>
            
            <div class="relative">
                <input type="tel" id="phone" pattern="[+0-9]{10,14}" placeholder=" " required class="block w-full rounded-xl border-gray-200 bg-white/50 border p-4 text-gray-900 focus:bg-white focus:ring-2 focus:ring-brand-500 focus:border-transparent outline-none transition-all peer placeholder-transparent">
                <label for="phone" class="absolute text-gray-500 duration-300 transform -translate-y-1/2 scale-100 top-1/2 left-4 z-10 origin-[0] peer-focus:text-brand-600 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-[-50%] peer-focus:scale-85 peer-focus:-translate-y-[1.5rem] bg-transparent px-1 font-medium pointer-events-none">WhatsApp Number</label>
            </div>
            
            <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-brand-600 to-indigo-600 text-white p-4 rounded-xl font-bold text-lg hover:shadow-lg hover:shadow-brand-500/30 transition-all active:scale-95 outline-none">
                Join the Waitlist
            </button>
        </form>

        <!-- Live Status View -->
        <section id="statusView" class="hidden flex flex-col items-center mt-2 relative z-10">
            <!-- Spinning Ambient Loader -->
<div class="relative flex justify-center items-center w-40 h-40 mb-6">
    <div class="absolute w-full h-full rounded-full border-4 border-dashed border-brand-300 border-t-brand-600 animate-[spin_8s_linear_infinite] opacity-50"></div>
    <div class="absolute inline-flex w-32 h-32 rounded-full bg-brand-500 opacity-20 animate-pulse"></div>
    <div class="relative flex flex-col justify-center items-center w-28 h-28 bg-gradient-to-br from-brand-500 to-indigo-600 rounded-full shadow-2xl border-2 border-white/50 text-white backdrop-blur-sm">
        <span class="text-[0.65rem] uppercase font-bold tracking-widest opacity-80 mb-1">Token</span>
        <span id="displayToken" class="text-4xl font-black leading-none">--</span>
    </div>
</div>

            <h2 id="liveStatusText" class="text-2xl font-extrabold text-gray-900 mb-2">You're in the queue!</h2>
            <p class="text-gray-500 font-medium mb-8">Patients ahead of you: <span id="peopleAhead" class="font-black text-brand-600 text-xl ml-1">--</span></p>

            <div class="w-full bg-white/80 border border-gray-100 p-5 rounded-2xl mb-6 flex justify-between items-center shadow-sm">
                <span class="text-gray-600 font-semibold">Estimated Wait</span>
                <span id="displayTime" class="text-2xl font-black text-brand-600">-- mins</span>
            </div>

            <div class="w-full bg-brand-50 border border-brand-100 p-5 rounded-2xl text-center shadow-inner">
                <span class="text-xs font-bold text-brand-400 uppercase tracking-widest mb-2 block">Did you know?</span>
                <p id="triviaText" class="text-sm text-brand-900 font-medium fade-text min-h-[40px] flex items-center justify-center">Drinking water boosts metabolism by up to 30%.</p>
            </div>
            
            <button id="cancelBtn" class="mt-8 text-sm font-bold text-gray-400 hover:text-red-500 transition-colors outline-none pb-1 border-b-2 border-transparent hover:border-red-500">
                Cancel My Turn
            </button>
        </section>
    </main>

    <script>
        // Note: This uses your latest active Google Script URL
        // 1. Read the Clinic ID from the scanned QR Code URL
const urlParams = new URLSearchParams(window.location.search);
const clinicId = urlParams.get('c') || 'citycare'; // Fallback for testing

// 2. The Public API Directory (No passwords here, just routing links)
const PUBLIC_API_DIRECTORY = {
    'citycare': 'https://script.google.com/macros/s/AKfycbzN4GuiY6ue5D0UTj8nJ5XSKtjbv8Y8CFdYyC1e-citPAcjYlHwgYE9-yVYUttfET-4CQ/exec',
    'smileplus': 'YOUR_CLINIC_2_API_URL_HERE' // Add new clinics here as you grow
};

// 3. Assign the correct API based on the QR code
const API_URL = PUBLIC_API_DIRECTORY[clinicId];

if (!API_URL) {
    alert("Invalid Clinic QR Code. Please ask the receptionist for assistance.");
}
        
        const State = { token: null, interval: null, triviaIndex: 0, lastStatus: null }; 
        const trivia = [
    "Hydration is key: Drinking water boosts your metabolism by up to 30%.", 
    "Laughter is medicine: Laughing physically increases your blood flow by 20%.", 
    "Your body produces around 25 million new, healthy cells every single second.",
    "Your brain operates on about 20 watts of electrical power—enough to light a dim bulb!",
    "Human bones are incredibly dense. Pound for pound, they are stronger than steel.",
    "A 20-minute power nap can significantly boost your memory, alertness, and mood.",
    "Your heart is a powerhouse, pumping about 2,000 gallons of blood every single day.",
    "Listening to your favorite music can naturally reduce anxiety and even physical pain.",
    "Human teeth are just as strong as shark teeth!",
    "Taking just a 15-minute walk outside can vastly improve your mood and lower stress.",
    "Your nose is an incredible sensor—it can remember up to 50,000 different scents.",
    "Sleep acts like a dishwasher for your brain, clearing out toxins while you rest."
];
        // --- LOCAL STORAGE INIT LOGIC ---
        window.addEventListener('DOMContentLoaded', () => {
            const savedToken = localStorage.getItem('qc_token');
            if (savedToken) {
                State.token = savedToken;
                document.getElementById('joinForm').classList.add('hidden');
                document.getElementById('statusView').classList.remove('hidden');
                document.getElementById('displayToken').innerText = '#' + State.token;
                startTrivia();
                startLiveTracking();
            }
        });

        function startTrivia() {
            setInterval(() => {
                const el = document.getElementById('triviaText'); el.style.opacity = 0;
                setTimeout(() => { State.triviaIndex = (State.triviaIndex + 1) % trivia.length; el.innerText = trivia[State.triviaIndex]; el.style.opacity = 1; }, 500);
            }, 8000);
        }

        function showToast(message, type = 'error') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast translate-y-[-100%] opacity-0 ${type==='error'?'bg-red-500':'bg-gray-900'} text-white px-6 py-3 rounded-xl shadow-2xl text-sm font-bold border border-white/20`;
            toast.innerText = message;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-[-100%]', 'opacity-0'));
            setTimeout(() => { toast.classList.add('opacity-0'); setTimeout(() => toast.remove(), 400); }, 3000);
        }

        document.getElementById('joinForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerText;
            btn.innerText = 'Securing spot...'; btn.disabled = true;
            
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'join', name: document.getElementById('name').value, phone: document.getElementById('phone').value }) });
                const result = await res.json();
                
                if(result.success) {
                    State.token = result.token;
                    // SAVE TO LOCAL STORAGE
                    localStorage.setItem('qc_token', result.token); 

                    document.getElementById('joinForm').classList.add('hidden');
                    document.getElementById('statusView').classList.remove('hidden');
                    document.getElementById('displayToken').innerText = '#' + State.token;
                    document.getElementById('displayTime').innerText = result.waitTime + ' mins';
                    
                    startTrivia();
                    startLiveTracking();
                } else throw new Error('Failed to join');
            } catch (error) { 
                showToast('Network error. Please try again.'); 
                btn.innerText = originalText; btn.disabled = false; 
            }
        });

        document.getElementById('cancelBtn').addEventListener('click', async function() {
            if(confirm("Are you sure you want to leave the waiting list?")) {
                this.innerText = 'Cancelling...'; this.disabled = true;
                try {
                    await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'cancel', token: State.token }) });
                    clearInterval(State.interval);
                    
                    // CLEAR LOCAL STORAGE
                    localStorage.removeItem('qc_token');
                    
                    document.getElementById('statusView').innerHTML = `
                        <div class="text-center py-12">
                            <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4"><span class="text-2xl">👋</span></div>
                            <h2 class="text-2xl font-bold text-gray-800 mb-2">You've left the queue.</h2>
                            <p class="text-gray-500 font-medium">Have a great day.</p>
                        </div>`;
                } catch (e) { showToast('Error cancelling'); this.innerText = 'Cancel My Turn'; this.disabled = false; }
            }
        });

        async function fetchQueueStatus() {
    if (!State.token || document.hidden) return;
    try {
        const res = await fetch(`${API_URL}?token=${State.token}`);
        const data = await res.json();
        
        if(data.user) {
            // Only update wait times if the elements are still on screen
            const timeEl = document.getElementById('displayTime');
            const aheadEl = document.getElementById('peopleAhead');
            if (timeEl) timeEl.innerText = data.user.dynamicWait + ' mins';
            if (aheadEl) aheadEl.innerText = data.peopleAhead;
            
            // Trigger major UI changes ONLY when the status officially changes
            if (State.lastStatus !== data.user.status) {
                State.lastStatus = data.user.status;
                
                if (data.user.status === 'Active') { 
                    const st = document.getElementById('liveStatusText');
                    if (st) {
                        st.innerText = "It's almost your turn!"; 
                        st.className = 'text-2xl font-extrabold text-brand-600 mb-2';
                    }
                } 
                else if (data.user.status === 'Called') {
                    // The 'Invite' Screen
                    document.getElementById('statusView').innerHTML = `
                        <div class="text-center py-10 w-full animate-pulse">
                            <div class="w-32 h-32 bg-green-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-2xl shadow-green-500/50 border-4 border-white text-white">
                                <span class="text-5xl">🔔</span>
                            </div>
                            <h2 class="text-3xl font-black text-green-600 mb-2 tracking-tight">It's your turn!</h2>
                            <p class="text-lg text-gray-700 font-bold mb-2">The Doctor is ready for you.</p>
                            <p class="text-gray-500 font-medium">Please proceed to the consultation room.</p>
                        </div>
                    `;
                } 
                else if (data.user.status === 'Completed') { 
                    clearInterval(State.interval); 
                    localStorage.removeItem('qc_token');
                    
                    // The 'Discharge' Screen
                    document.getElementById('statusView').innerHTML = `
                        <div class="text-center py-6 w-full fade-text">
                            <div class="w-24 h-24 bg-brand-50 rounded-full flex items-center justify-center mx-auto mb-6 text-brand-500">
                                <span class="text-4xl">✨</span>
                            </div>
                            <h2 class="text-2xl font-extrabold text-slate-900 mb-2">Thank you for visiting!</h2>
                            <p class="text-gray-500 font-medium mb-8">We hope you feel better soon, ${data.user.name}.</p>
                            
                            <div class="bg-gradient-to-r from-brand-600 to-indigo-600 p-6 rounded-2xl text-white shadow-xl shadow-brand-500/20 mb-8">
                                <h3 class="font-bold text-lg mb-2">How was your visit?</h3>
                                <p class="text-brand-100 text-sm mb-4">Your feedback helps us improve our care.</p>
                                <a href="#" class="inline-block bg-white text-brand-600 px-6 py-2.5 rounded-xl font-bold text-sm hover:scale-105 transition-transform">Leave a Google Review</a>
                            </div>
                            
                            <button onclick="location.reload()" class="text-sm font-bold text-gray-400 hover:text-brand-600 transition-colors border-b-2 border-transparent hover:border-brand-600 pb-1 outline-none">Start New Visit</button>
                        </div>
                    `;
                } 
                else if (data.user.status === 'Cancelled') {
                    clearInterval(State.interval);
                    localStorage.removeItem('qc_token');
                }
            }
        }
    } catch (e) { console.error(e); }
}        function startLiveTracking() { 
            fetchQueueStatus(); 
            State.interval = setInterval(fetchQueueStatus, 10000); 
            document.addEventListener("visibilitychange", () => { if (!document.hidden) fetchQueueStatus(); }); 
        }
    </script>
</body>
</html>
