<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Lobby Display | QueueCounter+</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            /* Premium soft gradient background */
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        }
        .fade-text { transition: opacity 0.8s ease-in-out; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05);
        }
        .super-rounded { border-radius: 2.5rem; }
    </style>
</head>
<!-- Added padding so the UI "floats" on the screen -->
<body class="h-screen w-screen p-6 flex flex-col gap-6 overflow-hidden text-slate-800 antialiased">

    <!-- Premium Floating Header -->
    <header class="glass-panel rounded-3xl px-8 py-5 flex justify-between items-center z-10 shrink-0">
        <div class="flex items-center gap-4">
            <div class="w-14 h-14 bg-gradient-to-br from-brand-600 to-indigo-600 bg-blue-600 text-white rounded-2xl flex items-center justify-center text-3xl shadow-lg shadow-blue-500/30">✨</div>
            <div>
                <h1 id="clinicNameDisplay" class="text-3xl font-black text-slate-900 tracking-tight leading-none">Loading Clinic...</h1>
                <p class="text-slate-500 font-bold text-sm tracking-widest uppercase mt-1">Live Queue Display</p>
            </div>
        </div>
        <div id="clock" class="text-3xl font-black text-slate-700 bg-white/50 px-6 py-3 rounded-2xl border border-slate-200 shadow-sm">--:--</div>
    </header>

    <!-- Main Content Area (Unified but distinguishable) -->
    <main class="flex-1 flex gap-6 min-h-0">
        
        <!-- LEFT COLUMN: The Queue (65% width) -->
        <section class="w-[65%] flex flex-col gap-6 h-full">
            
            <!-- Currently Serving (Shrunk to give more space below) -->
            <div class="glass-panel super-rounded p-8 flex flex-col items-center justify-center relative shrink-0 h-2/5">
                <div class="bg-emerald-50 text-emerald-600 px-6 py-2 rounded-full font-black tracking-widest uppercase text-sm mb-2 border border-emerald-100 flex items-center gap-3 shadow-sm">
                    <span class="w-3 h-3 bg-emerald-500 rounded-full animate-ping"></span> Now Serving
                </div>
                <!-- Shrunk font size from 12rem to 8rem -->
                <div id="nowServing" class="text-[8rem] leading-none font-black text-slate-900 tracking-tighter drop-shadow-sm">--</div>
                <div id="nowServingName" class="text-3xl font-bold text-slate-400 mt-2">Waiting for doctor...</div>
            </div>

            <!-- Get Ready List (Expanded to fit more tokens) -->
            <div class="glass-panel super-rounded p-8 flex flex-col flex-1 min-h-0">
                <h2 class="text-xl font-black text-slate-800 uppercase tracking-widest mb-6 flex items-center gap-3 shrink-0">
                    <span class="text-amber-500 text-2xl">⏳</span> Please Get Ready
                </h2>
                <!-- Grid layout easily holds 8+ tokens aesthetically -->
                <div id="getReadyList" class="grid grid-cols-2 xl:grid-cols-3 gap-4 overflow-hidden content-start">
                    <div class="text-xl font-bold text-slate-400 col-span-full">Queue is currently empty.</div>
                </div>
            </div>
        </section>

        <!-- RIGHT COLUMN: Sidebar & QR Kiosk (35% width) -->
        <section class="w-[35%] glass-panel super-rounded p-10 flex flex-col relative h-full">
            
            <!-- The Self-Serve Check-In QR -->
            <div class="bg-gradient-to-br from-indigo-50 to-blue-50 p-6 rounded-3xl border border-blue-100 shadow-inner flex flex-col items-center text-center mb-8 shrink-0">
                <h3 class="text-lg font-black text-indigo-900 uppercase tracking-widest mb-1">Join the Waitlist</h3>
                <p class="text-sm font-semibold text-indigo-600 mb-5">Scan with your phone camera</p>
                <div class="bg-white p-3 rounded-2xl shadow-md border border-white">
                    <div id="qrcode-tv" class="w-40 h-40 flex items-center justify-center bg-slate-50 rounded-xl"></div>
                </div>
            </div>

            <!-- Health Facts (Takes up remaining space) -->
            <div class="flex-1 flex flex-col justify-center relative">
                <span class="bg-slate-100 text-slate-500 px-4 py-2 rounded-full text-xs font-black uppercase tracking-widest border border-slate-200 self-start mb-6">
                    💡 Did you know?
                </span>
                <p id="tvContent" class="text-3xl font-bold text-slate-600 leading-tight fade-text opacity-100">
                    Loading today's facts...
                </p>
            </div>

            <!-- Footer Branding -->
            <div class="mt-8 pt-8 border-t border-slate-200 flex items-center gap-4 shrink-0">
                <div class="w-12 h-12 bg-indigo-100 rounded-xl flex items-center justify-center text-2xl text-indigo-600">🩺</div>
                <div>
                    <p class="text-slate-800 font-black text-xl leading-tight">Your Health.</p>
                    <p class="text-slate-500 text-sm font-semibold">Our absolute priority.</p>
                </div>
            </div>
        </section>
    </main>

    <audio id="chime" src="https://actions.google.com/sounds/v1/alarms/positive_alert_beep.ogg" preload="auto"></audio>

    <script>
        // 1. Pull routing info from the TV's browser memory
        const API_URL = localStorage.getItem('active_api');
        const CLINIC_NAME = localStorage.getItem('active_clinic_name');
        const CLINIC_ID = localStorage.getItem('clinic_id');

        if (!API_URL) {
            window.location.href = 'login.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (CLINIC_NAME) {
                document.getElementById('clinicNameDisplay').innerText = CLINIC_NAME;
            }
            
            // 2. GENERATE THE SMART QR CODE FOR THIS SPECIFIC CLINIC
            if (CLINIC_ID) {
                const baseUrl = window.location.href.split('?')[0].replace('tv.html', '');
                const cleanBase = baseUrl.endsWith('/') ? baseUrl : baseUrl + '/';
                const patientUrl = `${cleanBase}index.html?c=${CLINIC_ID}`;
                
                new QRCode(document.getElementById("qrcode-tv"), { 
                    text: patientUrl, 
                    width: 160, 
                    height: 160, 
                    colorDark: "#1e3a8a", // Dark blue QR code to match theme
                    colorLight: "#ffffff", 
                    correctLevel: QRCode.CorrectLevel.M 
                });
            }
        });

        let lastCalledToken = null;
        let triviaIndex = 0;
        const trivia = [
            "Drinking water boosts your metabolism by up to 30%.", 
            "Laughter physically increases your blood flow by 20%.", 
            "Your body produces 25 million new, healthy cells every second.",
            "A 20-minute power nap significantly boosts memory and alertness.",
            "Taking a 15-minute walk outside vastly improves your mood.",
            "Sleep acts like a dishwasher for your brain, clearing out toxins."
        ];

        // Clock Logic
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        }, 1000);

        // Trivia Logic
        setInterval(() => {
            const el = document.getElementById('tvContent');
            el.style.opacity = 0;
            setTimeout(() => {
                triviaIndex = (triviaIndex + 1) % trivia.length;
                el.innerText = trivia[triviaIndex];
                el.style.opacity = 1;
            }, 800);
        }, 10000);

        // Fetch Queue Data
        async function fetchLobbyData() {
            try {
                const liveUrl = API_URL + "?t=" + new Date().getTime();
                const res = await fetch(liveUrl);
                const data = await res.json();
                
                let patients = [];
                if (data.data && Array.isArray(data.data)) { patients = data.data; } 
                else if (Array.isArray(data)) { patients = data; }
                
                if(patients.length > 0) {
                    
                    // --- HANDLE "NOW SERVING" ---
                    const called = patients.filter(p => p.status === 'Called');
                    const nowServingEl = document.getElementById('nowServing');
                    const nowServingNameEl = document.getElementById('nowServingName');
                    
                    if (called.length > 0) {
                        const current = called[0];
                        nowServingEl.innerText = '#' + current.token;
                        nowServingNameEl.innerText = current.name;
                        nowServingEl.classList.add('text-emerald-500');
                        nowServingEl.classList.remove('text-slate-900');
                        
                        if (lastCalledToken !== current.token) {
                            lastCalledToken = current.token;
                            document.getElementById('chime').play().catch(e => console.log("Click page to allow audio."));
                        }
                    } else {
                        nowServingEl.innerText = '--';
                        nowServingNameEl.innerText = 'Available';
                        nowServingEl.classList.remove('text-emerald-500');
                        nowServingEl.classList.add('text-slate-900');
                        lastCalledToken = null;
                    }

                    // --- HANDLE "PLEASE GET READY" (Redesigned Grid Layout) ---
                    const active = patients.filter(p => p.status === 'Active');
                    const readyList = document.getElementById('getReadyList');
                    
                    if (active.length > 0) {
                        // Display up to 9 upcoming patients in a sleek grid
                        readyList.innerHTML = active.slice(0, 9).map(p => `
                            <div class="bg-white/60 border border-slate-200 px-5 py-3 rounded-2xl shadow-sm flex items-center gap-3">
                                <span class="text-2xl font-black text-indigo-600 bg-indigo-50 w-12 h-12 flex items-center justify-center rounded-xl">#${p.token}</span>
                                <span class="text-lg font-bold text-slate-700 truncate">${p.name.split(' ')[0]}</span>
                            </div>
                        `).join('');
                    } else {
                        readyList.innerHTML = '<div class="text-xl font-bold text-slate-400 col-span-full">Queue is currently empty.</div>';
                    }
                }
            } catch (e) { console.error("Fetch error:", e); }
        }

        fetchLobbyData();
        setInterval(fetchLobbyData, 5000); 

        // Audio permissions click
        document.body.addEventListener('click', () => { document.getElementById('chime').load(); }, { once: true });
    </script>
</body>
</html>
