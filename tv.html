<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Lobby Display | City Care Clinic</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .fade-text { transition: opacity 0.8s ease-in-out; }
        #nowServing, #nowServingName { transition: all 0.4s ease-in-out; }
    </style>
</head>
<body class="bg-slate-50 h-screen w-screen flex overflow-hidden text-slate-800 antialiased">

    <!-- LEFT COLUMN: Live Queue (75%) -->
    <section class="w-3/4 flex flex-col h-full border-r border-slate-200">
        
        <!-- Header -->
        <header class="bg-white px-8 py-5 flex justify-between items-center border-b border-slate-200 z-10 shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-gradient-to-br from-blue-600 to-indigo-600 text-white rounded-xl flex items-center justify-center text-2xl shadow-lg">✨</div>
                <div>
                    <h1 class="text-3xl font-black text-slate-900 tracking-tight leading-none">City Care Clinic</h1>
                    <p class="text-slate-500 font-bold text-xs tracking-widest uppercase mt-1">Live Patient Queue</p>
                </div>
            </div>
            <div id="clock" class="text-2xl font-black text-slate-700 bg-slate-100 px-5 py-2 rounded-xl border border-slate-200">12:00 PM</div>
        </header>

        <!-- Main Queue Area -->
        <div class="flex-1 p-8 flex flex-col gap-6 bg-slate-50 relative overflow-hidden">
            <!-- Currently Serving -->
            <div class="flex-1 bg-white rounded-[2rem] shadow-md border border-slate-200 p-10 flex flex-col items-center justify-center relative">
                
                <div class="bg-emerald-100 text-emerald-700 px-6 py-2.5 rounded-full font-black tracking-widest uppercase text-sm mb-6 border border-emerald-200 flex items-center gap-3 shadow-sm">
                    <span class="w-3 h-3 bg-emerald-500 rounded-full animate-ping"></span> Now Serving
                </div>
                
                <div id="nowServing" class="text-[12rem] leading-none font-black text-slate-900 tracking-tighter drop-shadow-sm">--</div>
                <div id="nowServingName" class="text-4xl font-bold text-slate-400 mt-4">Waiting for doctor...</div>
            </div>

            <!-- Get Ready List -->
            <div class="h-1/3 bg-white rounded-[2rem] shadow-md border border-slate-200 p-8 flex flex-col">
                <h2 class="text-xl font-black text-slate-800 uppercase tracking-widest mb-6 flex items-center gap-3">
                    <span class="text-amber-500 text-2xl">⏳</span> Please Get Ready
                </h2>
                <div id="getReadyList" class="flex gap-4 flex-wrap">
                    <div class="text-2xl font-bold text-slate-400">Queue is currently empty.</div>
                </div>
            </div>
        </div>
    </section>

    <!-- RIGHT COLUMN: Health Facts Sidebar (25%) -->
    <section class="w-1/4 bg-slate-100 p-10 flex flex-col relative shadow-inner border-l border-slate-200">
        <div class="mb-10">
            <span class="bg-blue-100 text-blue-700 px-4 py-2 rounded-full text-xs font-black uppercase tracking-widest border border-blue-200 shadow-sm">
                💡 Did you know?
            </span>
        </div>
        
        <div class="flex-1 flex items-center">
            <p id="tvContent" class="text-2xl font-bold text-slate-600 leading-relaxed fade-text opacity-100">
                Loading today's facts...
            </p>
        </div>

        <div class="mt-auto pt-8 border-t border-slate-300 flex items-center gap-4">
            <div class="w-10 h-10 bg-white rounded-lg shadow flex items-center justify-center text-xl">🩺</div>
            <div>
                <p class="text-slate-800 font-black text-lg leading-tight">City Care Clinic</p>
                <p class="text-slate-500 text-sm font-semibold">Your Health, Our Priority.</p>
            </div>
        </div>
    </section>

    <audio id="chime" src="https://actions.google.com/sounds/v1/alarms/positive_alert_beep.ogg" preload="auto"></audio>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzN4GuiY6ue5D0UTj8nJ5XSKtjbv8Y8CFdYyC1e-citPAcjYlHwgYE9-yVYUttfET-4CQ/exec';
        let lastCalledToken = null;
        const trivia = [
            "Drinking water boosts your metabolism by up to 30%.", 
            "Laughter physically increases your blood flow by 20%.", 
            "Your body produces 25 million new, healthy cells every second.",
            "A 20-minute power nap significantly boosts memory and alertness.",
            "Taking a 15-minute walk outside vastly improves your mood.",
            "Sleep acts like a dishwasher for your brain, clearing out toxins."
        ];
        let triviaIndex = 0;

        // Clock Logic
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        }, 1000);

        // Trivia Logic
        setInterval(() => {
            const el = document.getElementById('tvContent');
            el.style.opacity = 0;
            setTimeout(() => {
                triviaIndex = (triviaIndex + 1) % trivia.length;
                el.innerText = trivia[triviaIndex];
                el.style.opacity = 1;
            }, 800);
        }, 10000);

        // Fetch Queue Data (WITH CACHE BUSTER)
        async function fetchLobbyData() {
            try {
                // THE CACHE BUSTER: appending a live timestamp forces the browser to pull fresh data
                const liveUrl = API_URL + "?t=" + new Date().getTime();
                const res = await fetch(liveUrl);
                const data = await res.json();
                
                // Navigate Google Apps Script data structure
                let patients = [];
                if (data.data && Array.isArray(data.data)) { patients = data.data; } 
                else if (Array.isArray(data)) { patients = data; }
                
                if(patients.length > 0) {
                    
                    // --- 1. HANDLE "NOW SERVING" (Called Status) ---
                    const called = patients.filter(p => p.status === 'Called');
                    const nowServingEl = document.getElementById('nowServing');
                    const nowServingNameEl = document.getElementById('nowServingName');
                    
                    if (called.length > 0) {
                        const current = called[0];
                        nowServingEl.innerText = '#' + current.token;
                        nowServingNameEl.innerText = current.name;
                        nowServingEl.classList.add('text-emerald-600');
                        nowServingEl.classList.remove('text-slate-900');
                        
                        // Play chime
                        if (lastCalledToken !== current.token) {
                            lastCalledToken = current.token;
                            document.getElementById('chime').play().catch(e => console.log("Click page to allow audio."));
                        }
                    } else {
                        nowServingEl.innerText = '--';
                        nowServingNameEl.innerText = 'Available';
                        nowServingEl.classList.remove('text-emerald-600');
                        nowServingEl.classList.add('text-slate-900');
                        lastCalledToken = null;
                    }

                    // --- 2. HANDLE "PLEASE GET READY" (Active Status) ---
                    const active = patients.filter(p => p.status === 'Active');
                    const readyList = document.getElementById('getReadyList');
                    
                    if (active.length > 0) {
                        readyList.innerHTML = active.slice(0, 5).map(p => `
                            <div class="bg-white border-2 border-slate-200 px-6 py-4 rounded-2xl shadow-sm flex items-center gap-4">
                                <span class="text-3xl font-black text-slate-800">#${p.token}</span>
                                <span class="text-xl font-bold text-slate-500">${p.name}</span>
                            </div>
                        `).join('');
                    } else {
                        readyList.innerHTML = '<div class="text-2xl font-bold text-slate-400">Queue is currently empty.</div>';
                    }
                }
            } catch (e) { console.error("Fetch error:", e); }
        }

        // Fetch immediately, then check every 5 seconds (faster syncing!)
        fetchLobbyData();
        setInterval(fetchLobbyData, 5000); 

        // Audio permissions click
        document.body.addEventListener('click', () => { document.getElementById('chime').load(); }, { once: true });
    </script>
</body>
</html>
