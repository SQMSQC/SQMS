<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobby Display | City Care Clinic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] } } }
        }
    </script>
    <style>
        body { background-color: #f8fafc; overflow: hidden; }
        .fade-text { transition: opacity 0.8s ease-in-out; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col">

    <!-- Top Banner -->
    <header class="bg-slate-900 text-white p-6 shadow-md flex justify-between items-center z-10">
        <h1 class="text-4xl font-black tracking-tight">City Care Clinic</h1>
        <div class="text-2xl font-bold text-slate-300" id="clock">12:00 PM</div>
    </header>

    <!-- Main Split Screen -->
    <main class="flex-1 flex overflow-hidden">
        
        <!-- LEFT COLUMN: Queue Status (60%) -->
        <section class="w-3/5 bg-white flex flex-col p-8 border-r border-slate-200">
            
            <!-- Currently Serving -->
            <div class="flex-1 flex flex-col justify-center items-center text-center mb-8 bg-green-50 rounded-3xl border-4 border-green-100 p-10 relative overflow-hidden">
                <div class="absolute top-0 w-full h-2 bg-green-500 animate-pulse"></div>
                <h2 class="text-3xl font-bold text-green-700 uppercase tracking-widest mb-4">Now Serving / In Session</h2>
                <div id="nowServing" class="text-8xl font-black text-slate-900 drop-shadow-sm">--</div>
                <p id="nowServingName" class="text-3xl font-bold text-slate-500 mt-4">Waiting for doctor...</p>
            </div>

            <!-- Next to Get Ready -->
            <div class="h-1/3 bg-slate-50 rounded-3xl p-8 border border-slate-200">
                <h2 class="text-2xl font-bold text-amber-600 uppercase tracking-widest mb-6 flex items-center gap-3">
                    <span class="w-4 h-4 rounded-full bg-amber-500 animate-pulse"></span> Please Get Ready
                </h2>
                <div id="getReadyList" class="flex flex-wrap gap-4">
                    <!-- Upcoming tokens populate here -->
                    <div class="text-2xl font-semibold text-slate-400">No patients waiting.</div>
                </div>
            </div>

        </section>

        <!-- RIGHT COLUMN: TV / Media Section (40%) -->
        <section class="w-2/5 bg-gradient-to-br from-brand-600 to-indigo-900 relative overflow-hidden flex flex-col justify-center items-center p-12 text-center shadow-inner">
            <!-- Decorative background blob -->
            <div class="absolute -top-32 -right-32 w-96 h-96 bg-white opacity-5 rounded-full mix-blend-overlay"></div>
            <div class="absolute -bottom-32 -left-32 w-96 h-96 bg-indigo-500 opacity-20 rounded-full mix-blend-overlay"></div>

            <div class="relative z-10 w-full bg-white/10 backdrop-blur-md rounded-3xl border border-white/20 p-10 shadow-2xl">
                <span class="inline-block px-4 py-1 rounded-full bg-white/20 text-white text-sm font-bold uppercase tracking-widest mb-8">Daily Health Fact</span>
                <p id="tvContent" class="text-4xl font-extrabold text-white leading-tight fade-text min-h-[250px] flex items-center justify-center">
                    Loading today's facts...
                </p>
            </div>
        </section>
    </main>

    <!-- Hidden Audio for Chime -->
    <audio id="chime" src="https://actions.google.com/sounds/v1/alarms/positive_alert_beep.ogg" preload="auto"></audio>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzN4GuiY6ue5D0UTj8nJ5XSKtjbv8Y8CFdYyC1e-citPAcjYlHwgYE9-yVYUttfET-4CQ/exec';
        
        let lastCalledToken = null;
        const trivia = [
            "Drinking water boosts your metabolism by up to 30%.", 
            "Laughter physically increases your blood flow by 20%.", 
            "Your body produces around 25 million new, healthy cells every single second.",
            "A 20-minute power nap can significantly boost your memory and alertness.",
            "Taking just a 15-minute walk outside can vastly improve your mood and lower stress.",
            "Sleep acts like a dishwasher for your brain, clearing out toxins while you rest."
        ];
        let triviaIndex = 0;

        // Clock Logic
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        }, 1000);

        // TV Content Rotator
        setInterval(() => {
            const el = document.getElementById('tvContent');
            el.style.opacity = 0;
            setTimeout(() => {
                triviaIndex = (triviaIndex + 1) % trivia.length;
                el.innerText = trivia[triviaIndex];
                el.style.opacity = 1;
            }, 800);
        }, 10000); // Rotates every 10 seconds

        // Queue Fetching Logic
        async function fetchLobbyData() {
            try {
                // We can reuse the Dashboard's fetch method to get all data
                const res = await fetch(API_URL);
                const data = await res.json();
                
                if(data.data && Array.isArray(data.data)) {
                    const patients = data.data;
                    
                    // Find who is currently called/in session
                    const called = patients.filter(p => p.status === 'Called');
                    const nowServingEl = document.getElementById('nowServing');
                    const nowServingNameEl = document.getElementById('nowServingName');
                    
                    if (called.length > 0) {
                        const current = called[0]; // Assuming one doctor
                        nowServingEl.innerText = '#' + current.token;
                        nowServingNameEl.innerText = current.name;
                        
                        // Play chime if it's a new patient
                        if (lastCalledToken !== current.token) {
                            lastCalledToken = current.token;
                            document.getElementById('chime').play().catch(e => console.log("Audio requires interaction first."));
                        }
                    } else {
                        nowServingEl.innerText = '--';
                        nowServingNameEl.innerText = 'Available';
                        lastCalledToken = null;
                    }

                    // Find who needs to get ready (Active status)
                    const active = patients.filter(p => p.status === 'Active');
                    const readyList = document.getElementById('getReadyList');
                    
                    if (active.length > 0) {
                        readyList.innerHTML = active.slice(0, 4).map(p => `
                            <div class="bg-white border-2 border-slate-200 px-6 py-3 rounded-2xl shadow-sm flex items-center gap-3">
                                <span class="text-2xl font-black text-slate-800">#${p.token}</span>
                                <span class="text-lg font-semibold text-slate-500">${p.name}</span>
                            </div>
                        `).join('');
                    } else {
                        readyList.innerHTML = '<div class="text-2xl font-semibold text-slate-400">Queue is currently empty.</div>';
                    }
                }
            } catch (e) {
                console.error("Failed to fetch lobby data:", e);
            }
        }

        // Initial fetch and set interval
        fetchLobbyData();
        setInterval(fetchLobbyData, 10000); // Check every 10 seconds

        // Note: Browsers block audio from playing automatically. 
        // The doctor just needs to click anywhere on this page ONCE before casting it to unlock the chime sound.
        document.body.addEventListener('click', () => {
            document.getElementById('chime').load();
        }, { once: true });
    </script>
</body>
</html>
